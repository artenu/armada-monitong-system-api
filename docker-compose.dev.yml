# Database PostgreSQL untuk development lokal.
# Jalankan: docker compose -f docker-compose.dev.yml up -d
# Password diambil dari POSTGRES_PASSWORD di file .env
services:
  postgres:
    image: postgres:18
    container_name: armada-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: armada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi di .env}
      POSTGRES_DB: armada_dev
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - armada-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armada -d armada_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  armada-pgdata:
